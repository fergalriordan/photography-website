<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- No background: the square is the mark, the tab shows through around it.
       Ink flips with the browser theme so it never vanishes into the chrome. -->
  <style>
    rect { fill: #222222 }
    @media (prefers-color-scheme: dark) { rect { fill: #f4f5f7 } }
  </style>
  <rect x="6" y="6" width="52" height="52"/>
</svg>
